  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let peerId = null;
    let inCall = false;
    let searching = false;
    let watchdog = null;
    let qualityTimer = null;
    let videoOk = false;
    let currentMax = 700;
    let pendingIce = [];
    let lowMediaStreak = 0;

    (() => {
      const conn = navigator.connection;
      if (conn && typeof conn.downlink === 'number') {
        if (conn.downlink < 1.5) currentMax = 220;
        else if (conn.downlink < 3) currentMax = 380;
        else currentMax = 700;
      }
    })();

    const localVideo = document.getElementById('local');
    const remoteVideo = document.getElementById('remote');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const nextBtn = document.getElementById('nextBtn');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');
    const onlineEl = document.getElementById('online');
    const chatToggle = document.getElementById('chatToggle');
    const chatPanel = document.getElementById('chatPanel');
    const chatClose = document.getElementById('chatClose');
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');
    const chatToast = document.getElementById('chatToast');
    const chatBadge = document.getElementById('chatBadge');
    let chatUnread = 0;

    let dbgCounters = { start: 0, stop: 0, next: 0, matched: 0, offerRecv: 0, answerRecv: 0, iceRecv: 0, iceSent: 0, iceBuffered: 0, chatRecv: 0, chatSend: 0 };
    let dbgEvents = [];
    let dbgStats = {};
    const debugBtn = document.getElementById('debugBtn');
    const debugPanelEl = document.getElementById('debugPanel');
    const debugBody = document.getElementById('debugBody');
    const debugClose = document.getElementById('debugClose');
    const debugDownload = document.getElementById('debugDownload');

    function dbgLog(tag, msg) {
      const e = { t: Date.now(), tag: String(tag), msg: String(msg) };
      dbgEvents.push(e);
      if (dbgEvents.length > 300) dbgEvents.shift();
      console.log('[' + new Date(e.t).toISOString().slice(11, 23) + ']', tag, msg);
    }

    window.addEventListener('error', (e) => dbgLog('err', e.message + ' @' + (e.filename || '') + ':' + (e.lineno || '?')));
    window.addEventListener('unhandledrejection', (e) => dbgLog('err', 'reject: ' + ((e.reason && e.reason.message) || e.reason)));

    debugBtn.addEventListener('click', () => {
      const open = debugPanelEl.classList.toggle('hide');
      if (open) refreshDebug();
    });
    debugClose.addEventListener('click', () => debugPanelEl.classList.add('hide'));
    debugDownload.addEventListener('click', () => {
      const data = JSON.stringify({ ua: navigator.userAgent, counters: dbgCounters, events: dbgEvents, stats: dbgStats }, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'chatruletka-debug.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    async function refreshDebug() {
      const L = [];
      L.push('Browser: ' + navigator.userAgent.slice(0, 90));
      L.push('WebRTC: ' + (typeof RTCPeerConnection !== 'undefined' ? 'ok' : 'YOQ') + ' | gUM: ' + (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? 'ok' : 'YOQ'));
      L.push('ICE: ' + iceServers.map((s) => String(s.urls)).join(' | '));
      L.push('pc=' + (pc ? pc.connectionState : 'null') + ' ice=' + (pc ? pc.iceConnectionState : '-'));
      L.push('inCall=' + inCall + ' searching=' + searching + ' peer=' + (peerId || '-'));
      L.push('C: start=' + dbgCounters.start + ' stop=' + dbgCounters.stop + ' next=' + dbgCounters.next + ' matched=' + dbgCounters.matched);
      L.push('C: offerRecv=' + dbgCounters.offerRecv + ' ansRecv=' + dbgCounters.answerRecv + ' iceRecv=' + dbgCounters.iceRecv + ' iceSent=' + dbgCounters.iceSent + ' buffered=' + dbgCounters.iceBuffered + ' chatR=' + dbgCounters.chatRecv + ' chatS=' + dbgCounters.chatSend);
      if (pc) {
        try {
          const st = await pc.getStats();
          let rtt = null, jit = null, loss = null, pkts = null, fr = null;
          const loc = {}, rem = {};
          let sel = null;
          st.forEach((s) => {
            if (s.type === 'local-candidate') loc[s.id] = s;
            if (s.type === 'remote-candidate') rem[s.id] = s;
            if (s.type === 'candidate-pair' && !sel && (s.nominated || s.state === 'succeeded')) sel = s;
            if (s.type === 'remote-inbound-rtp' && s.kind === 'video') {
              if (typeof s.roundTripTime === 'number') rtt = s.roundTripTime;
              if (typeof s.jitter === 'number') jit = s.jitter;
            }
            if (s.type === 'inbound-rtp' && s.kind === 'video') {
              pkts = s.packetsReceived; loss = s.packetsLost;
              fr = (s.framesReceived != null) ? s.framesReceived : s.framesDecoded;
            }
          });
          let pairRelay = false;
          if (sel) {
            const a = loc[sel.localCandidateId], b = rem[sel.remoteCandidateId];
            const ta = a ? a.candidateType : '?', tb = b ? b.candidateType : '?';
            L.push('Pair: ' + ta + ' <-> ' + tb + ' (' + (sel.state || '?') + ')');
            if (a) L.push('Local: ' + a.protocol + ':' + a.port + '(' + a.ip + ')');
            if (b) L.push('Remote: ' + b.protocol + ':' + b.port + '(' + (b.ip || '') + ')');
            L.push('Active: ' + sel.bytesReceived + 'B rcv / ' + sel.bytesSent + 'B snt');
            if (ta === 'relay' || tb === 'relay') pairRelay = true;
          }
          if (rtt !== null) L.push('RTT=' + (rtt * 1000).toFixed(0) + 'ms jitter=' + (jit * 1000).toFixed(0) + 'ms');
          if (pkts != null) L.push('video pkts=' + pkts + ' lost=' + (loss || 0) + ' frames=' + fr);
          dbgStats = { rttMs: rtt != null ? Math.round(rtt * 1000) : null, jitterMs: jit != null ? Math.round(jit * 1000) : null, lost: loss || 0, pkts: pkts, frames: fr, pairRelay: pairRelay };
          L.push(pairRelay ? '== MAQSAD = RELAY (TURN orqali) ==' : '== MAQSAD: to\'g\'ridan-to\'g\'ri/host ==');
        } catch (e) {
          L.push('stats err: ' + e.message);
        }
      }
      L.push('--- Log ---');
      const last = dbgEvents.slice(-30);
      last.forEach((e) => L.push(new Date(e.t).toISOString().slice(11, 19) + ' ' + e.tag + ': ' + e.msg));
      if (!last.length) L.push('(hali xodisalar yo\'q)');
      debugBody.textContent = L.join('\n');
    }

    setInterval(() => {
      if (!debugPanelEl.classList.contains('hide')) refreshDebug();
    }, 1500);

    const defaultIceServers = [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
      { urls: 'stun:stun.cloudflare.com:3478' },
      {
        urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443'],
        username: 'openrelay',
        credential: 'openrelay'
      }
    ];
    let iceServers = defaultIceServers;

    fetch('/ice')
      .then((r) => r.json())
      .then((extra) => {
        if (Array.isArray(extra) && extra.length) {
          iceServers = defaultIceServers.concat(extra);
        }
      })
      .catch(() => {});

    function rtcConfig() {
      return {
        iceServers,
        bundlePolicy: 'max-bundle',
        iceCandidatePoolSize: 4
      };
    }

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusEl.style.color = color || '#fff';
    }

    function setCallingUI(calling) {
      startBtn.classList.toggle('hide', !!calling);
      stopBtn.classList.toggle('hide', !calling);
      nextBtn.classList.toggle('hide', !calling);
    }

    function toggleTrack(kind, btn) {
      const t = localStream && localStream.getTracks().find((x) => x.kind === kind);
      if (!t) return;
      t.enabled = !t.enabled;
      btn.classList.toggle('off', !t.enabled);
    }

    stopBtn.addEventListener('click', () => {
      dbgCounters.stop += 1;
      dbgLog('ui', 'stop');
      socket.emit('stop');
      cleanup();
      searching = false;
      nextBtn.disabled = true;
      startBtn.disabled = false;
      setCallingUI(false);
      setStatus('Suhbat to\'xtatildi. Qayta boshlash mumkin.', '#9aa3b5');
    });

    micBtn.addEventListener('click', () => toggleTrack('audio', micBtn));
    camBtn.addEventListener('click', () => toggleTrack('video', camBtn));

    socket.on('online', (n) => {
      onlineEl.textContent = typeof n === 'number' ? n : 0;
    });

    async function initLocalStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 20, max: 25 }
          },
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        localVideo.srcObject = localStream;
      }
    }

    async function adaptQuality(p, kbps) {
      const sender = p.getSenders().find((s) => s.track && s.track.kind === 'video');
      if (!sender || typeof sender.setParameters !== 'function') return;
      try {
        const params = sender.getParameters();
        if (params.encodings && params.encodings.length) {
          params.encodings[0].maxBitrate = Math.round(kbps * 1000);
          await sender.setParameters(params);
        }
      } catch (e) {}
    }

    async function qualityLoop() {
      if (!inCall || !pc) return;
      try {
        const stats = await pc.getStats();
        let rtt = null;
        let loss = null;
        stats.forEach((s) => {
          if (s.type === 'remote-inbound-rtp' && s.kind === 'video') {
            if (typeof s.roundTripTime === 'number') rtt = s.roundTripTime;
          }
          if (s.type === 'inbound-rtp' && s.kind === 'video') {
            const t = s.packetsLost;
            const n = s.packetsReceived;
            if (t != null && n != null) loss = n + t > 0 ? t / (n + t) : 0;
          }
        });
        const bad = (rtt !== null && rtt > 0.25) || (loss !== null && loss > 0.08);
        if (bad && currentMax > 150) {
          currentMax = Math.max(150, Math.round(currentMax * 0.6));
          await adaptQuality(pc, currentMax);
          setStatus('Internet sekin — video sifat kamaytirildi.', '#ffb74d');
        } else if (!bad && currentMax < 700) {
          currentMax = Math.min(700, Math.round(currentMax * 1.4));
          await adaptQuality(pc, currentMax);
        }
      } catch (e) {}
      qualityTimer = setTimeout(qualityLoop, 4000);
    }

    function startQualityLoop() {
      clearTimeout(qualityTimer);
      qualityTimer = setTimeout(qualityLoop, 3000);
    }

    function createPeerConnection() {
      const p = new RTCPeerConnection(rtcConfig());
      localStream.getTracks().forEach((track) => p.addTrack(track, localStream));
      videoOk = false;
      remoteStream = new MediaStream();
      remoteVideo.srcObject = remoteStream;

      p.onicecandidate = (e) => {
        if (e.candidate) {
          dbgCounters.iceSent += 1;
          socket.emit('ice-candidate', { to: peerId, candidate: e.candidate });
        }
      };
      p.ontrack = (e) => {
        const s = e.streams && e.streams[0];
        const tracks = s ? s.getTracks() : [e.track];
        tracks.forEach((t) => {
          if (!remoteStream.getTracks().includes(t)) remoteStream.addTrack(t);
          if (t.kind === 'video') {
            t.addEventListener('mute', () => {
              if (inCall) setStatus('Subbatdosh kamerasi o\'chirilgan.', '#ffb74d');
            });
            t.addEventListener('unmute', () => {
              if (inCall) checkVideoHealth();
            });
          }
        });
        if (remoteVideo.srcObject !== remoteStream) remoteVideo.srcObject = remoteStream;
        remoteVideo.play().catch(() => {});
      };
      p.oniceconnectionstatechange = () => {
        const st = p.iceConnectionState;
        dbgLog('pc', 'ice=' + st);
        if (st === 'connected' || st === 'completed') {
          startVideoWatchdog();
          startQualityLoop();
        } else if (st === 'failed') {
          setStatus('Ulanish muvaffaqiyatsiz. Keyingisiga o\'tildi.', '#ffb74d');
          autoNext(2500);
        } else if (st === 'disconnected') {
          watchdogTimeout(() => {
            if (pc && pc.iceConnectionState === 'disconnected' && inCall) {
              setStatus('Subbatdosh yo\'qolib ketdi. Keyingisiga o\'tildi.', '#ffb74d');
              autoNext(1000);
            }
          }, 6000);
        }
      };
      return p;
    }

    async function checkVideoHealth() {
      if (!inCall || !pc) return;
      const vt = remoteStream ? remoteStream.getVideoTracks()[0] : null;
      let pkts = null;
      let frames = null;
      let hasEntry = false;
      try {
        const stats = await pc.getStats();
        stats.forEach((s) => {
          if (s.type === 'inbound-rtp' && s.kind === 'video') {
            hasEntry = true;
            if (pkts === null && s.packetsReceived != null) pkts = s.packetsReceived;
            if (frames === null) {
              const f = s.framesReceived != null ? s.framesReceived : s.framesDecoded;
              if (typeof f === 'number') frames = f;
            }
          }
        });
      } catch (e) {}

      if (vt && vt.muted) {
        lowMediaStreak = 0;
        setStatus('Subbatdosh kamerasi o\'chirilgan.', '#ffb74d');
        watchdog = setTimeout(checkVideoHealth, 3000);
        return;
      }

      if (frames !== null && frames > 0) {
        lowMediaStreak = 0;
        if (!videoOk) {
          videoOk = true;
          setStatus('Subbatdosh ulandi.', '#6bd98e');
        }
        watchdog = setTimeout(checkVideoHealth, 3000);
        return;
      }

      if (hasEntry && pkts !== null && pkts > 0) {
        lowMediaStreak = 0;
        watchdog = setTimeout(checkVideoHealth, 2500);
        return;
      }

      lowMediaStreak += 1;
      if (lowMediaStreak < 5) {
        watchdog = setTimeout(checkVideoHealth, 2500);
        return;
      }

      lowMediaStreak = 0;
      videoOk = false;
      setStatus('Video signal umuman kelmayapti. Keyingisiga o\'tilmoqda...', '#ffb74d');
      autoNext(800);
    }

    function startVideoWatchdog() {
      clearTimeout(watchdog);
      watchdog = setTimeout(checkVideoHealth, 2000);
    }

    function watchdogTimeout(fn, ms) {
      clearTimeout(watchdog);
      watchdog = setTimeout(fn, ms);
    }

    function autoNext(delay) {
      dbgLog('ui', 'autoNext in ' + delay + 'ms');
      setTimeout(() => {
        if (!inCall) return;
        socket.emit('next');
        cleanup();
        searching = true;
        nextBtn.disabled = true;
        setCallingUI(false);
        setStatus('Subbatdosh qidirilmoqda...');
      }, delay);
    }

    function waitGatheringComplete(p, timeoutMs) {
      return new Promise((resolve) => {
        if (p.iceGatheringState === 'complete') return resolve();
        const timer = setTimeout(resolve, timeoutMs);
        p.addEventListener('icegatheringstatechange', () => {
          if (p.iceGatheringState === 'complete') {
            clearTimeout(timer);
            resolve();
          }
        });
      });
    }

    async function flushIce() {
      if (!pendingIce.length) return;
      const c = pendingIce.splice(0);
      for (const cand of c) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (e) {}
      }
    }

    remoteVideo.addEventListener('playing', () => {
      if (inCall) checkVideoHealth();
    });

    async function cleanup() {
      clearTimeout(watchdog);
      clearTimeout(qualityTimer);
      videoOk = false;
      lowMediaStreak = 0;
      pendingIce.length = 0;
      clearUnread();
      chatToast.classList.remove('show');
      if (pc) {
        pc.onicecandidate = null;
        pc.ontrack = null;
        pc.oniceconnectionstatechange = null;
        pc.close();
        pc = null;
      }
      remoteVideo.srcObject = null;
      peerId = null;
      inCall = false;
      chatLog.innerHTML = '';
    }

    function appendChat(text, mine) {
      const div = document.createElement('div');
      div.className = mine ? 'msg mine' : 'msg';
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function sendChat() {
      if (!inCall) return;
      const text = chatInput.value.trim();
      if (!text) return;
      socket.emit('chat-message', { text });
      dbgCounters.chatSend += 1;
      dbgLog('chat', 'send: ' + text.slice(0, 40));
      appendChat(text, true);
      chatInput.value = '';
      chatInput.focus();
    }

    function clearUnread() {
      chatUnread = 0;
      chatBadge.hidden = true;
    }

    function showToast(text) {
      chatToast.textContent = text;
      chatToast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => chatToast.classList.remove('show'), 4000);
    }

    function playDing() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ac = playDing.ac || (playDing.ac = new Ctx());
        if (ac.state === 'suspended') ac.resume();
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.08, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
        o.connect(g);
        g.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + 0.3);
      } catch (e) {}
    }

    chatToggle.addEventListener('click', () => {
      const willOpen = !chatPanel.classList.contains('open');
      chatPanel.classList.toggle('open');
      if (willOpen) clearUnread();
    });
    chatClose.addEventListener('click', () => chatPanel.classList.remove('open'));
    chatToast.addEventListener('click', () => {
      chatPanel.classList.add('open');
      clearUnread();
      chatToast.classList.remove('show');
    });
    chatSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    socket.on('matched', async ({ partnerId, initiator }) => {
      peerId = partnerId;
      inCall = true;
      searching = false;
      dbgCounters.matched += 1;
      dbgLog('sig', 'matched initiator=' + initiator);
      setCallingUI(true);
      nextBtn.disabled = false;
      setStatus('Subbatdosh topildi!');
      const p = createPeerConnection();
      pc = p;
      adaptQuality(p, currentMax);
      if (initiator) {
        const offer = await p.createOffer();
        await p.setLocalDescription(offer);
        await waitGatheringComplete(p, 2500);
        if (peerId !== partnerId) return;
        socket.emit('offer', { to: partnerId, sdp: p.localDescription });
        dbgLog('sig', 'offer sent (gather=' + p.iceGatheringState + ')');
      }
    });

    socket.on('offer', async ({ from, sdp }) => {
      peerId = from;
      inCall = true;
      searching = false;
      dbgCounters.offerRecv += 1;
      dbgLog('sig', 'offer recv');
      setCallingUI(true);
      nextBtn.disabled = false;
      setStatus('Subbatdosh topildi!');
      const p = createPeerConnection();
      pc = p;
      adaptQuality(p, currentMax);
      await p.setRemoteDescription(new RTCSessionDescription(sdp));
      await flushIce();
      const answer = await p.createAnswer();
      await p.setLocalDescription(answer);
      await waitGatheringComplete(p, 2500);
      if (peerId !== from) return;
      socket.emit('answer', { to: from, sdp: p.localDescription });
      dbgLog('sig', 'answer sent (gather=' + p.iceGatheringState + ')');
    });

    socket.on('answer', async ({ from, sdp }) => {
      dbgCounters.answerRecv += 1;
      dbgLog('sig', 'answer recv');
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
        await flushIce();
      }
    });

    socket.on('ice-candidate', ({ from, candidate }) => {
      if (!candidate) return;
      if (from && peerId && from !== peerId) return;
      dbgCounters.iceRecv += 1;
      if (!pc || !pc.remoteDescription) {
        pendingIce.push(candidate);
        dbgCounters.iceBuffered += 1;
        return;
      }
      try {
        pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) {}
    });

    socket.on('chat-message', ({ text }) => {
      dbgCounters.chatRecv += 1;
      appendChat(text, false);
      playDing();
      if (chatPanel.classList.contains('open')) {
        clearUnread();
      } else {
        chatUnread += 1;
        chatBadge.textContent = chatUnread > 99 ? '99+' : chatUnread;
        chatBadge.hidden = false;
        showToast('Yangi xabar: ' + text);
      }
    });

    socket.on('partner-disconnected', () => {
      dbgLog('sig', 'partner-disconnected');
      cleanup();
      searching = false;
      nextBtn.disabled = true;
      startBtn.disabled = false;
      setCallingUI(false);
      setStatus('Subbatdosh chiqib ketdi. Qayta boshlash mumkin.', '#ff6b6b');
    });

    socket.on('disconnect', () => {
      dbgLog('sig', 'disconnected');
      cleanup();
      searching = false;
      nextBtn.disabled = true;
      startBtn.disabled = false;
      setCallingUI(false);
      setStatus('Server bilan aloqa uzildi. Qayta ulanmoqda...', '#ffb74d');
    });

    socket.on('connect', () => {
      dbgLog('sig', 'connected (socket.io)');
      if (searching) socket.emit('start');
    });

    startBtn.addEventListener('click', async () => {
      try {
        await initLocalStream();
        dbgCounters.start += 1;
        dbgLog('ui', 'start');
        searching = true;
        socket.emit('start');
        setCallingUI(false);
        startBtn.disabled = true;
        nextBtn.disabled = true;
        setStatus('Subbatdosh qidirilmoqda...');
      } catch (err) {
        setStatus('Kamera/mikrofonga ruxsat berishingiz shart.', '#ff6b6b');
        console.error(err);
      }
    });

    nextBtn.addEventListener('click', () => {
      dbgCounters.next += 1;
      dbgLog('ui', 'next');
      socket.emit('next');
      cleanup();
      searching = true;
      nextBtn.disabled = true;
      setCallingUI(false);
      setStatus('Subbatdosh qidirilmoqda...');
    });

    window.addEventListener('beforeunload', () => {
      if (pc) pc.close();
    });

    setInterval(() => {
      if (socket.connected) socket.emit('heartbeat');
    }, 45000);
  </script>
</body>
</html>
