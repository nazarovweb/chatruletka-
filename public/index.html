  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f1117;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    h1 { padding: 16px; font-size: 22px; letter-spacing: 1px; }
    h1 span { color: #4fc3f7; }
    #videos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 860px;
      padding: 0 12px;
    }
    @media (max-width: 720px) {
      #videos {
        grid-template-columns: 1fr;
        max-width: 460px;
      }
      .video-wrap:nth-child(2) { order: -1; }
      #chatPanel { left: 10px; right: 10px; width: auto; height: 55%; bottom: 120px; }
    }
    .video-wrap { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .label {
      position: absolute; top: 8px; left: 10px;
      font-size: 12px; background: rgba(0,0,0,.55);
      padding: 3px 8px; border-radius: 10px;
    }
    #status { margin-top: 14px; font-size: 15px; min-height: 22px; }
    .controls { display: flex; gap: 10px; margin: 14px 0 20px; }
    button {
      padding: 12px 26px; font-size: 16px; border: none;
      border-radius: 999px; cursor: pointer; font-weight: bold;
    }
    #startBtn { background: #4fc3f7; color: #0f1117; }
    #nextBtn { background: #ff5252; color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #chatToggle {
      position: fixed; right: 14px; bottom: 72px;
      padding: 13px 18px; font-size: 15px;
      background: #4fc3f7; color: #0f1117;
      border: none; border-radius: 999px; cursor: pointer; z-index: 10; font-weight: bold;
    }
    #chatPanel {
      position: fixed; right: 14px; bottom: 132px;
      width: 320px; height: 58%; max-height: 420px;
      background: #161925; border: 1px solid #2c3242; border-radius: 14px;
      display: none; flex-direction: column; overflow: hidden; z-index: 11;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    #chatPanel.open { display: flex; }
    .chat-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; border-bottom: 1px solid #2c3242; font-weight: bold;
    }
    .chat-close { cursor: pointer; background: none; border: none; color: #9aa3b5; font-size: 18px; padding: 0 4px; }
    #chatLog { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
    .msg {
      align-self: flex-start; background: #262c3b; color: #fff;
      padding: 7px 11px; border-radius: 12px 12px 12px 4px;
      max-width: 82%; font-size: 14px; word-break: break-word; line-height: 1.35;
    }
    .msg.mine { align-self: flex-end; background: #4fc3f7; color: #0f1117; border-radius: 12px 12px 4px 12px; }
    .chat-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #2c3242; }
    #chatInput {
      flex: 1; background: #262c3b; color: #fff; border: none;
      border-radius: 999px; padding: 9px 14px; outline: none; font-size: 14px;
    }
    #chatSend { background: #4fc3f7; color: #0f1117; border: none; border-radius: 999px; padding: 9px 16px; font-weight: bold; cursor: pointer; }
    .chat-badge {
      position: absolute; top: -5px; right: -5px;
      background: #ff5252; color: #fff; font-size: 11px; font-weight: bold;
      min-width: 20px; height: 20px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; padding: 0 5px;
    }
    #chatToast {
      position: fixed; top: 14px; left: 50%;
      transform: translateX(-50%) translateY(-140%);
      background: rgba(22,25,37,.96); border: 1px solid #4fc3f7; color: #fff;
      padding: 11px 18px; border-radius: 12px; font-size: 14px; z-index: 25;
      max-width: 84%; box-shadow: 0 6px 24px rgba(0,0,0,.5);
      cursor: pointer; transition: transform .25s ease; text-align: center; word-break: break-word;
    }
    #chatToast.show { transform: translateX(-50%) translateY(0); }

<body>
  <h1>Chat<span>Ruletka</span></h1>

  <div id="videos">
    <div class="video-wrap">
      <video id="local" autoplay muted playsinline></video>
      <div class="label">Siz</div>
    </div>
    <div class="video-wrap">
      <video id="remote" autoplay playsinline></video>
      <div class="label">Subbatdosh</div>
    </div>
  </div>

  <div id="status"></div>

  <div class="controls">
    <button id="startBtn">Boshlash</button>
    <button id="nextBtn" disabled>Keyingisi</button>
  </div>

  <button id="chatToggle">Chat<span id="chatBadge" class="chat-badge" hidden></span></button>

  <div id="chatToast"></div>

  <div id="chatPanel">
    <div class="chat-head"><span>Chat</span><button class="chat-close" id="chatClose">&times;</button></div>
    <div id="chatLog"></div>
    <div class="chat-foot">
      <input id="chatInput" type="text" placeholder="Xabar yozing..." maxlength="500" autocomplete="off">
      <button id="chatSend">Yuborish</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let peerId = null;
    let inCall = false;
    let searching = false;
    let watchdog = null;
    let qualityTimer = null;
    let videoOk = false;
    let currentMax = 700;
    let pendingIce = [];

    (() => {
      const conn = navigator.connection;
      if (conn && typeof conn.downlink === 'number') {
        if (conn.downlink < 1.5) currentMax = 220;
        else if (conn.downlink < 3) currentMax = 380;
        else currentMax = 700;
      }
    })();

    const localVideo = document.getElementById('local');
    const remoteVideo = document.getElementById('remote');
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');
    const chatToggle = document.getElementById('chatToggle');
    const chatPanel = document.getElementById('chatPanel');
    const chatClose = document.getElementById('chatClose');
    const chatLog = document.getElementById('chatLog');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');
    const chatToast = document.getElementById('chatToast');
    const chatBadge = document.getElementById('chatBadge');
    let chatUnread = 0;

    const defaultIceServers = [
      { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
      { urls: 'stun:stun.cloudflare.com:3478' },
      {
        urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443'],
        username: 'openrelay',
        credential: 'openrelay'
      }
    ];
    let iceServers = defaultIceServers;

    fetch('/ice')
      .then((r) => r.json())
      .then((extra) => {
        if (Array.isArray(extra) && extra.length) {
          iceServers = defaultIceServers.concat(extra);
        }
      })
      .catch(() => {});

    function rtcConfig() {
      return {
        iceServers,
        bundlePolicy: 'max-bundle',
        iceCandidatePoolSize: 4
      };
    }

    function setStatus(text, color) {
      statusEl.textContent = text;
      statusEl.style.color = color || '#fff';
    }

    async function initLocalStream() {
      if (!localStream) {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            frameRate: { ideal: 20, max: 25 }
          },
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        localVideo.srcObject = localStream;
      }
    }

    async function adaptQuality(p, kbps) {
      const sender = p.getSenders().find((s) => s.track && s.track.kind === 'video');
      if (!sender || typeof sender.setParameters !== 'function') return;
      try {
        const params = sender.getParameters();
        if (params.encodings && params.encodings.length) {
          params.encodings[0].maxBitrate = Math.round(kbps * 1000);
          await sender.setParameters(params);
        }
      } catch (e) {}
    }

    async function qualityLoop() {
      if (!inCall || !pc) return;
      try {
        const stats = await pc.getStats();
        let rtt = null;
        let loss = null;
        stats.forEach((s) => {
          if (s.type === 'remote-inbound-rtp' && s.kind === 'video') {
            if (typeof s.roundTripTime === 'number') rtt = s.roundTripTime;
          }
          if (s.type === 'inbound-rtp' && s.kind === 'video') {
            const t = s.packetsLost;
            const n = s.packetsReceived;
            if (t != null && n != null) loss = n + t > 0 ? t / (n + t) : 0;
          }
        });
        const bad = (rtt !== null && rtt > 0.25) || (loss !== null && loss > 0.08);
        if (bad && currentMax > 150) {
          currentMax = Math.max(150, Math.round(currentMax * 0.6));
          await adaptQuality(pc, currentMax);
          setStatus('Internet sekin — video sifat kamaytirildi.', '#ffb74d');
        } else if (!bad && currentMax < 700) {
          currentMax = Math.min(700, Math.round(currentMax * 1.4));
          await adaptQuality(pc, currentMax);
        }
      } catch (e) {}
      qualityTimer = setTimeout(qualityLoop, 4000);
    }

    function startQualityLoop() {
      clearTimeout(qualityTimer);
      qualityTimer = setTimeout(qualityLoop, 3000);
    }

    function createPeerConnection() {
      const p = new RTCPeerConnection(rtcConfig());
      localStream.getTracks().forEach((track) => p.addTrack(track, localStream));
      videoOk = false;
      remoteStream = new MediaStream();
      remoteVideo.srcObject = remoteStream;

      p.onicecandidate = (e) => {
        if (e.candidate) {
          socket.emit('ice-candidate', { to: peerId, candidate: e.candidate });
        }
      };
      p.ontrack = (e) => {
        const s = e.streams && e.streams[0];
        const tracks = s ? s.getTracks() : [e.track];
        tracks.forEach((t) => {
          if (!remoteStream.getTracks().includes(t)) remoteStream.addTrack(t);
          if (t.kind === 'video') {
            t.addEventListener('mute', () => {
              if (inCall) setStatus('Subbatdosh kamerasi o\'chirilgan.', '#ffb74d');
            });
            t.addEventListener('unmute', () => {
              if (inCall) checkVideoHealth();
            });
          }
        });
        if (remoteVideo.srcObject !== remoteStream) remoteVideo.srcObject = remoteStream;
        remoteVideo.play().catch(() => {});
      };
      p.oniceconnectionstatechange = () => {
        const st = p.iceConnectionState;
        if (st === 'connected' || st === 'completed') {
          startVideoWatchdog();
          startQualityLoop();
        } else if (st === 'failed') {
          setStatus('Ulanish muvaffaqiyatsiz. Keyingisiga o\'tildi.', '#ffb74d');
          autoNext(2500);
        } else if (st === 'disconnected') {
          watchdogTimeout(() => {
            if (pc && pc.iceConnectionState === 'disconnected' && inCall) {
              setStatus('Subbatdosh yo\'qolib ketdi. Keyingisiga o\'tildi.', '#ffb74d');
              autoNext(1000);
            }
          }, 6000);
        }
      };
      return p;
    }

    async function checkVideoHealth() {
      if (!inCall || !pc) return;
      const vt = remoteStream ? remoteStream.getVideoTracks()[0] : null;
      let frames = null;
      try {
        const stats = await pc.getStats();
        stats.forEach((s) => {
          if (s.type === 'inbound-rtp' && s.kind === 'video') {
            const f = s.framesReceived != null ? s.framesReceived : s.framesDecoded;
            if (typeof f === 'number' && frames === null) frames = f;
          }
        });
      } catch (e) {}

      if (frames !== null && frames > 0) {
        if (!videoOk) {
          videoOk = true;
          setStatus('Subbatdosh ulandi.', '#6bd98e');
        }
        return;
      }
      if (vt && vt.muted) {
        setStatus('Subbatdosh kamerasi o\'chirilgan.', '#ffb74d');
        watchdog = setTimeout(checkVideoHealth, 5000);
        return;
      }
      if (frames === null) {
        watchdog = setTimeout(checkVideoHealth, 3000);
        return;
      }
      videoOk = false;
      setStatus('Ulangan, lekin video kelmayapti. Keyingisiga o\'tilmoqda...', '#ffb74d');
      autoNext(800);
    }

    function startVideoWatchdog() {
      clearTimeout(watchdog);
      watchdog = setTimeout(checkVideoHealth, 1500);
    }

    function watchdogTimeout(fn, ms) {
      clearTimeout(watchdog);
      watchdog = setTimeout(fn, ms);
    }

    function autoNext(delay) {
      setTimeout(() => {
        if (!inCall) return;
        socket.emit('next');
        cleanup();
        searching = true;
        nextBtn.disabled = true;
        setStatus('Subbatdosh qidirilmoqda...');
      }, delay);
    }

    function waitGatheringComplete(p, timeoutMs) {
      return new Promise((resolve) => {
        if (p.iceGatheringState === 'complete') return resolve();
        const timer = setTimeout(resolve, timeoutMs);
        p.addEventListener('icegatheringstatechange', () => {
          if (p.iceGatheringState === 'complete') {
            clearTimeout(timer);
            resolve();
          }
        });
      });
    }

    async function flushIce() {
      if (!pendingIce.length) return;
      const c = pendingIce.splice(0);
      for (const cand of c) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(cand));
        } catch (e) {}
      }
    }

    remoteVideo.addEventListener('playing', () => {
      if (inCall) checkVideoHealth();
    });

    async function cleanup() {
      clearTimeout(watchdog);
      clearTimeout(qualityTimer);
      videoOk = false;
      pendingIce.length = 0;
      clearUnread();
      chatToast.classList.remove('show');
      if (pc) {
        pc.onicecandidate = null;
        pc.ontrack = null;
        pc.oniceconnectionstatechange = null;
        pc.close();
        pc = null;
      }
      remoteVideo.srcObject = null;
      peerId = null;
      inCall = false;
      chatLog.innerHTML = '';
    }

    function appendChat(text, mine) {
      const div = document.createElement('div');
      div.className = mine ? 'msg mine' : 'msg';
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function sendChat() {
      if (!inCall) return;
      const text = chatInput.value.trim();
      if (!text) return;
      socket.emit('chat-message', { text });
      appendChat(text, true);
      chatInput.value = '';
      chatInput.focus();
    }

    function clearUnread() {
      chatUnread = 0;
      chatBadge.hidden = true;
    }

    function showToast(text) {
      chatToast.textContent = text;
      chatToast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => chatToast.classList.remove('show'), 4000);
    }

    function playDing() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ac = playDing.ac || (playDing.ac = new Ctx());
        if (ac.state === 'suspended') ac.resume();
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.08, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
        o.connect(g);
        g.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + 0.3);
      } catch (e) {}
    }

    chatToggle.addEventListener('click', () => {
      const willOpen = !chatPanel.classList.contains('open');
      chatPanel.classList.toggle('open');
      if (willOpen) clearUnread();
    });
    chatClose.addEventListener('click', () => chatPanel.classList.remove('open'));
    chatToast.addEventListener('click', () => {
      chatPanel.classList.add('open');
      clearUnread();
      chatToast.classList.remove('show');
    });
    chatSend.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendChat();
    });

    socket.on('matched', async ({ partnerId, initiator }) => {
      peerId = partnerId;
      inCall = true;
      searching = false;
      nextBtn.disabled = false;
      setStatus('Subbatdosh topildi!');
      const p = createPeerConnection();
      pc = p;
      adaptQuality(p, currentMax);
      if (initiator) {
        const offer = await p.createOffer();
        await p.setLocalDescription(offer);
        await waitGatheringComplete(p, 2500);
        if (peerId !== partnerId) return;
        socket.emit('offer', { to: partnerId, sdp: p.localDescription });
      }
    });

    socket.on('offer', async ({ from, sdp }) => {
      peerId = from;
      inCall = true;
      searching = false;
      nextBtn.disabled = false;
      setStatus('Subbatdosh topildi!');
      const p = createPeerConnection();
      pc = p;
      adaptQuality(p, currentMax);
      await p.setRemoteDescription(new RTCSessionDescription(sdp));
      await flushIce();
      const answer = await p.createAnswer();
      await p.setLocalDescription(answer);
      await waitGatheringComplete(p, 2500);
      if (peerId !== from) return;
      socket.emit('answer', { to: from, sdp: p.localDescription });
    });

    socket.on('answer', async ({ from, sdp }) => {
      if (pc) {
        await pc.setRemoteDescription(new RTCSessionDescription(sdp));
        await flushIce();
      }
    });

    socket.on('ice-candidate', async ({ from, candidate }) => {
      if (!pc || !candidate) return;
      if (!pc.remoteDescription) {
        pendingIce.push(candidate);
        return;
      }
      try {
        await pc.addIceCandidate(new RTCIceCandidate(candidate));
      } catch (e) {}
    });

    socket.on('chat-message', ({ text }) => {
      appendChat(text, false);
      playDing();
      if (chatPanel.classList.contains('open')) {
        clearUnread();
      } else {
        chatUnread += 1;
        chatBadge.textContent = chatUnread > 99 ? '99+' : chatUnread;
        chatBadge.hidden = false;
        showToast('Yangi xabar: ' + text);
      }
    });

    socket.on('partner-disconnected', () => {
      cleanup();
      searching = false;
      nextBtn.disabled = true;
      startBtn.disabled = false;
      startBtn.textContent = 'Boshlash';
      setStatus('Subbatdosh chiqib ketdi. Qayta boshlash mumkin.', '#ff6b6b');
    });

    socket.on('disconnect', () => {
      cleanup();
      searching = false;
      nextBtn.disabled = true;
      startBtn.disabled = false;
      setStatus('Server bilan aloqa uzildi. Qayta ulanmoqda...', '#ffb74d');
    });

    socket.on('connect', () => {
      if (searching) socket.emit('start');
    });

    startBtn.addEventListener('click', async () => {
      try {
        await initLocalStream();
        searching = true;
        socket.emit('start');
        startBtn.disabled = true;
        nextBtn.disabled = true;
        setStatus('Subbatdosh qidirilmoqda...');
      } catch (err) {
        setStatus('Kamera/mikrofonga ruxsat berishingiz shart.', '#ff6b6b');
        console.error(err);
      }
    });

    nextBtn.addEventListener('click', () => {
      socket.emit('next');
      cleanup();
      searching = true;
      nextBtn.disabled = true;
      setStatus('Subbatdosh qidirilmoqda...');
    });

    window.addEventListener('beforeunload', () => {
      if (pc) pc.close();
    });

    setInterval(() => {
      if (socket.connected) socket.emit('heartbeat');
    }, 45000);
  </script>
